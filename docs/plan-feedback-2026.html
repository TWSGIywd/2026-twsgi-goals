<style>
:root{--bg:#f6f5f1;--surface:#fff;--ink:#1f2633;--ink2:#465061;--muted:#6b7280;--line:#e3e1da;--blue:#2a78d6;--err:#b8461b}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
.kicker{font-size:13px;color:var(--muted);margin:0 0 4px}
h1{font-size:22px;line-height:1.4;margin:0 0 12px}
p.note{font-size:14px;color:var(--ink2);margin:0 0 20px}
label.f{display:block;font-size:14px;color:var(--ink2);margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--blue);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 18px;font-size:14px;color:var(--ink2)}
button{width:100%;font:inherit;font-size:16px;padding:10px;border:0;border-radius:8px;background:var(--blue);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:1.6em;margin:10px 0 0;font-size:14px;color:var(--err)}
.msg.wait{color:var(--muted)}
</style>

<script>
(function(){
  var KEY='plan-feedback-2026-pw';
  var P=JSON.parse(document.getElementById('payload').textContent);
  var f=document.getElementById('f'),pw=document.getElementById('pw'),rm=document.getElementById('rm'),go=document.getElementById('go'),msg=document.getElementById('msg');
  function bytes(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function store(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}}
  function load(k){try{return localStorage.getItem(k);}catch(_){return null;}}
  async function unlock(p){
    var s=crypto.subtle,base=await s.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
    var key=await s.deriveKey({name:'PBKDF2',salt:bytes(P.salt),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await s.decrypt({name:'AES-GCM',iv:bytes(P.iv)},key,bytes(P.ct));
    return new TextDecoder().decode(pt);
  }
  function show(html){
    var hash=location.hash;
    document.open();document.write(html);document.close();
    if(hash){setTimeout(function(){var el=document.getElementById(decodeURIComponent(hash.slice(1)));if(el)el.scrollIntoView();},50);}
  }
  async function attempt(p,remember,silent){
    go.disabled=true;msg.className='msg wait';msg.textContent='解密中…';
    try{var html=await unlock(p);}catch(e){
      go.disabled=false;msg.className='msg';
      if(!window.crypto||!crypto.subtle){msg.textContent='這個瀏覽器無法開啟，請改用 Chrome 或 Safari。';return;}
      if(silent){store(KEY,null);msg.textContent='';}else{msg.textContent='密碼不正確，請再試一次。';pw.select();}
      return;
    }
    store(KEY,remember?p:null);
    show(html);
  }
  f.addEventListener('submit',function(e){e.preventDefault();if(pw.value)attempt(pw.value,rm.checked,false);});
  var saved=load(KEY);
  if(saved)attempt(saved,true,true);else pw.focus();
})();
</script>
