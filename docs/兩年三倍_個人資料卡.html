document.getElementById("tp").textContent = `⏱ 時間進度 ${(D.tp*100).toFixed(1)}%（2026/1/1～2027/12/31，第 ${D.elapsed} / ${D.totalDays} 天）`;
document.getElementById("cards").innerHTML = DEPTS.map(d => {
  const [t,a] = D.nation[d], r = pct(a,t), gap = Math.max(t-a,0);
  return `<div class="card" style="--c:var(--c${d})"><h2>${d}</h2>
    <div class="big">${fmt(r)}</div><div class="frac">${num(a)} / ${num(t)}</div>
    <div class="bar"><i style="width:${Math.min((r||0)*100,100)}%"></i><b style="left:${D.tp*100}%"></b></div>
    <div class="gap">${gap ? "還差 "+num(gap) : "已達標 🎉"}　<span class="${r>=D.tp?'ahead':'behind'}">${r>=D.tp?'超前時間進度':'落後時間進度'}</span></div></div>`;
}).join("");
document.getElementById("head").innerHTML = `<th style="text-align:left">圈／區</th>` +
  DEPTS.map(d => `<th><span class="dot" style="background:var(--c${d})"></span>${d}</th>`).join("");
let order = "order", open = new Set();
function cell(s, d, showFrac) {
  const [t,a] = s[d], r = pct(a,t);
  return `<td class="${cls(r)}"><span class="${r!=null && r>=D.tp ? 'up' : ''}">${fmt(r)}</span>${showFrac ? `<small>${num(a)} / ${num(t)}</small>` : ""}</td>`;
}
function render() {
  let cs = D.circles.map((c,i) => ({...c, i}));
  if (order === "rate") cs.sort((x,y) => (pct(...y.sum["合計"].slice().reverse())||0) - (pct(...x.sum["合計"].slice().reverse())||0));
  document.getElementById("body").innerHTML = cs.map(c => {
    const isOpen = open.has(c.name);
    let h = `<tr><td class="name" data-c="${c.name}">${isOpen ? "▾" : "▸"} ${c.name}</td>${DEPTS.map(d => cell(c.sum, d, true)).join("")}</tr>`;
    if (isOpen) h += c.dists.map(x => `<tr class="dist"><td class="name">${x.name}</td>${DEPTS.map(d => cell(x.sum, d, true)).join("")}</tr>`).join("");
    return h;
  }).join("");
  document.querySelectorAll("td.name[data-c]").forEach(td => td.onclick = () => {
    const n = td.dataset.c; open.has(n) ? open.delete(n) : open.add(n); render(); });
}
document.getElementById("sOrder").onclick = e => { order="order"; e.target.classList.add("on"); sRate.classList.remove("on"); render(); };
document.getElementById("sRate").onclick = e => { order="rate"; e.target.classList.add("on"); sOrder.classList.remove("on"); render(); };
document.getElementById("expand").onclick = e => {
  if (open.size === D.circles.length) { open.clear(); e.target.textContent = "全部展開"; }
  else { D.circles.forEach(c => open.add(c.name)); e.target.textContent = "全部收合"; }
  render(); };
render();
</script>
</body>
</html>
